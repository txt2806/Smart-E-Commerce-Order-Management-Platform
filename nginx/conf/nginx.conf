worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        # 1. Serve Frontend React SPA (Built dist)
        location / {
            root   "D:/Code/Smart E-Commerce & Order Management Platform/frontend/dist";
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Reverse Proxy for Backend Spring Boot APIs
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass the next one-time token back to client
            proxy_pass_header X-Next-Access-Token;
            proxy_pass_header x-next-access-token;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
    }
}
